<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - AI Second Brain DAU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card glass-panel animate-slide-in">
            <a href="index.html">
                <img src="https://media.dau.edu.vn/Media/1_TH1057/Images/logo-dhktdn-150.png" alt="DAU Logo" class="auth-logo">
            </a>
            <h1 class="auth-title">Đăng ký tài khoản</h1>
            <p class="auth-subtitle">Trải nghiệm hệ thống học tập AI tiên tiến</p>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="email">Email sinh viên / giảng viên</label>
                    <input type="email" id="email" class="form-control" placeholder="mssv@dau.edu.vn" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Tạo tài khoản</button>
            </form>

            <p style="margin-top: 24px; color: var(--text-muted); font-size: 0.9rem;">
                Đã có tài khoản? <a href="login.html" style="color: var(--dau-red); text-decoration: none; font-weight: 600;">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
