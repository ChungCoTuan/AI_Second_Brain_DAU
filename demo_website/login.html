<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AI Second Brain DAU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card glass-panel animate-fade-in">
            <a href="index.html">
                <img src="https://media.dau.edu.vn/Media/1_TH1057/Images/logo-dhktdn-150.png" alt="DAU Logo" class="auth-logo">
            </a>
            <h1 class="auth-title">Chào mừng trở lại!</h1>
            <p class="auth-subtitle">Đăng nhập để truy cập AI Second Brain</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="vidu: student@dau.edu.vn" required>
                    <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; display: block;">* Mẹo: Nhập "admin", "teacher" hoặc email bất kỳ (student) để test các quyền khác nhau.</small>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Đăng nhập</button>
            </form>

            <p style="margin-top: 24px; color: var(--text-muted); font-size: 0.9rem;">
                Chưa có tài khoản? <a href="register.html" style="color: var(--dau-red); text-decoration: none; font-weight: 600;">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
