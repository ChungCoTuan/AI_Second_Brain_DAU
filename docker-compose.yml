version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dau_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-dau_second_brain}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dau_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Sửa DATABASE_URL thành host là tên service "db" thay vì "localhost" trong container
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456}@db:5432/${POSTGRES_DB:-dau_second_brain}
      POSTGRES_HOST: db
    volumes:
      # Mount /data để giữ nguyên Vector DB FAISS giữa các lần chạy
      - ./data:/app/data
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dau_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
