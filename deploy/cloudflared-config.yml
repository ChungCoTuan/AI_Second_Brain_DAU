# Cấu hình Cloudflare Tunnel mẫu cho môi trường test local.
# Thay <UUID> và dau-test.example.com bằng giá trị thật.
# Không commit file credentials JSON của tunnel.

tunnel: <UUID>
credentials-file: /home/<user>/.cloudflared/<UUID>.json

ingress:
  # API backend (FastAPI) chỉ nghe 127.0.0.1:8000
  - hostname: dau-test.example.com
    path: /api/*
    service: http://127.0.0.1:8000

  # Swagger UI / OpenAPI
  - hostname: dau-test.example.com
    path: /docs
    service: http://127.0.0.1:8000

  - hostname: dau-test.example.com
    path: /redoc
    service: http://127.0.0.1:8000

  - hostname: dau-test.example.com
    path: /openapi.json
    service: http://127.0.0.1:8000

  # Frontend đã build (vite preview) chỉ nghe 127.0.0.1:5173
  - hostname: dau-test.example.com
    service: http://127.0.0.1:5173

  - service: http_status:404
